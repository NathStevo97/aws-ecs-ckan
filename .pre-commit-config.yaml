
repos:
-   repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c # v6.0.0 # pragma: allowlist secret
    hooks:
    -   id: trailing-whitespace
    -   id: end-of-file-fixer
    -   id: check-yaml
    -   id: check-added-large-files
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.17.1 # immutable
  hooks:
    # Run the linter.
    - id: ruff-check
      args: [ --fix ]
    - id: ruff-format
-   repo: https://github.com/AleksaC/terraform-py
    rev: d72dfd5bd3694fb37d14151a9f06247ebafbb42a # v1.16.6 # pragma: allowlist secret
    hooks:
      - id: tf-fmt
      - id: tf-validate
-   repo: https://github.com/Yelp/detect-secrets
    rev: 01886c8a910c64595c47f186ca1ffc0b77fa5458 # v1.5.0 # pragma: allowlist secret
    hooks:
    -   id: detect-secrets
