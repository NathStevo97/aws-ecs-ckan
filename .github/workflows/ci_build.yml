name: CI Build

on:
  workflow_dispatch:

jobs:
  ckan-build:

    defaults:
      run:
        shell: bash

    runs-on: ubuntu-latest

    steps:
    - name: Checkout the Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Login to Docker Hub
      uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Docker Build - CKAN
      id: build-ckan
      run: |
        docker build -t docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ckan:latest ./ckan

    - name: Snyk Scan - CKAN
      uses: snyk/actions/docker@9adf32b1121593767fc3c057af55b55db032dc04 # v1.0.0
      env:
        SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
      with:
        image: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ckan:latest
        args: --severity-threshold=high

    - name: Docker Push - CKAN
      id: push-ckan
      run: |
        docker image push docker.io/${{ secrets.DOCKERHUB_USERNAME }}/ckan:latest

  ckan-datapusher-build:

    defaults:
      run:
        shell: bash

    runs-on: ubuntu-latest

    steps:
    - name: Checkout the Repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

    - name: Login to Docker Hub
